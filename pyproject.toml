[project]
name = "generator-assets"
version = "0.2.0"
description = "AI pipeline of 2D & 3D assets for the Godot Engine (Flux.1 Vulkan, LoRAs, 3D PBR materials, 360 skyboxes, ESRGAN upscale, Blender GLB mesh)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "opencv-python-headless>=4.9.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
# Style gate (audit §2.5 P2, widened on 2026-09-25 after the big cleanup):
# E4 = imports (E401/E402/E40x), E7 = comparisons/ambiguities (E701/E741…),
# E9 = syntax errors, F = pyflakes (dead imports/variables, undefined names),
# W = whitespace. E501 (line length) deliberately excluded: CLI help
# texts and docstrings in this repo are willingly long.
lint.select = ["E4", "E7", "E9", "F", "W"]
# E402 tolerated where the bootstrap pattern is deliberate: main.py reconfigures
# the UTF-8 console before its imports, scripts/ are standalone tools that
# install sys.path before importing the package, clothes_catalog must stay
# importable directly from disk.
exclude = [".agents"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"scripts/**" = ["E402"]
"core/clothes_catalog.py" = ["E402"]
