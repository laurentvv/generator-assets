[project]
name = "generator-assets"
version = "0.2.0"
description = "Pipeline IA d'Assets 2D & 3D pour Godot Engine (Flux.1 Vulkan, LoRAs, PBR Materials 3D, Skyboxes 360, Upscale ESRGAN, Blender Mesh GLB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "opencv-python-headless>=4.9.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
# Gate de style (audit §2.5 P2, élargie le 2026-09-25 après grand nettoyage) :
# E4 = imports (E401/E402/E40x), E7 = comparaisons/ambiguïtés (E701/E741…),
# E9 = erreurs de syntaxe, F = pyflakes (imports/variables mortes, noms indéfinis),
# W = whitespace. E501 (longueur de ligne) volontairement exclue : les help
# CLI et docstrings du dépôt sont volontiers longs.
lint.select = ["E4", "E7", "E9", "F", "W"]
# E402 toléré où le pattern bootstrap est délibéré : main.py reconfigure la
# console UTF-8 avant ses imports, scripts/ sont des outils autonomes qui
# installent sys.path avant d'importer le paquet, clothes_catalog doit rester
# importable en direct depuis le disque.
exclude = [".agents"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"scripts/**" = ["E402"]
"core/clothes_catalog.py" = ["E402"]
