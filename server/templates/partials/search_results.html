{% if matches %}
  {% for wf in matches %}
    <a href="/w/{{ wf['name'] }}" class="flex items-center gap-3 rounded-lg px-3 py-2 transition hover:bg-surface-3/70"
       @click="palette = false">
      <span class="text-lg">{{ wf['emoji'] }}</span>
      <span class="min-w-0">
        <span class="block font-mono text-[13px] font-semibold">{{ wf['name'] }}</span>
        <span class="block truncate text-[11px] text-ink-faint">{{ wf['description'] }}</span>
      </span>
    </a>
  {% endfor %}
{% else %}
  <p class="px-3 py-4 text-center text-[12px] text-ink-faint">No workflow matches.</p>
{% endif %}
