name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} — lint + pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (lock figé)
        run: uv sync --frozen

      - name: Lint — règles bloquantes (syntaxe + noms indéfinis)
        run: uv run --no-sync ruff check .

      - name: Tests (aucun moteur requis — faux exécutables et signaux synthétiques)
        run: uv run --no-sync pytest tests/ -v
